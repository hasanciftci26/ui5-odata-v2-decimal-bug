specVersion: '4.0'
metadata:
  name: ui5.decimal.bug
type: application
framework:
  name: OpenUI5
  version: 1.153.0
  libraries:
    - name: sap.ui.core
    - name: sap.m
server:
  customMiddleware:
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: cors-proxy
      afterMiddleware: compression
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: cors-proxy
middleware:
  path: middleware/proxy.js